[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "C4",   # flake8-comprehensions
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = ["E501"]  # line-too-long (black handles this)

[tool.ruff.lint.isort]
known-first-party = ["md2pdf"]

[tool.black]
line-length = 100
target-version = ["py39"]
